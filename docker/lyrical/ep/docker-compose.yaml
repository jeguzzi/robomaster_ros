services:
  driver:
    image: jeguzzi/robomaster_ros:lyrical
    build:
      context: ..
      dockerfile: Dockerfile
    network_mode: host
    pid: host
    ipc: host
    command: ros2 launch robomaster_ros main.launch model:=ep
  teleop:
    privileged: true
    image: jeguzzi/robomaster_ros:lyrical
    network_mode: host
    pid: host
    ipc: host
    command: ros2 launch robomaster_ros teleop.launch model:=ep
